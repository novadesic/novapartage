name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --verbose --no-banner

  license-guard:
    name: License guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block ag-grid-enterprise
        run: ./scripts/check-no-ag-grid-enterprise.sh

  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: novapartage_test
          POSTGRES_USER: novapartage
          POSTGRES_PASSWORD: novapartage_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novapartage -d novapartage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        env:
          DB_USERNAME: novapartage
          DB_PASSWORD: novapartage_password
        run: ./mvnw -B test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production
