<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
        <!-- Header -->
        <div style="background: {{headerGradient}}; color: white; padding: 30px; border-radius: 10px 10px 0 0; text-align: center;">
            <div style="display: inline-block; background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px;">
                <h1 style="margin: 0; font-size: 32px; font-weight: bold; letter-spacing: 2px;">NovaPartage</h1>
            </div>
            <p style="margin: 10px 0 0 0; opacity: 0.9; font-size: 16px;">{{headerSubtitle}}</p>
        </div>
        
        <!-- Content -->
        <div style="background: #f8f9fa; padding: 30px; border-radius: 0 0 10px 10px;">
            {{bodyContent}}
        </div>
        
        <!-- Footer -->
        <div style="text-align: center; margin-top: 20px; padding: 20px; color: #999; font-size: 12px;">
            <p>Cet email a été envoyé automatiquement par NovaPartage</p>
            <p>Si vous n'avez pas demandé cet email, vous pouvez l'ignorer.</p>
        </div>
    </div>
</body>
</html>
