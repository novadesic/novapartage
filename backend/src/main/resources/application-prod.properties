# Configuration pour NovaPartage Backend (Production)
# =====================================================

# Configuration Quarkus
quarkus.http.port=8083
quarkus.http.host=0.0.0.0

# Le backend utilise maintenant l'authentification personnalisée via JWT
# Pas de configuration OIDC nécessaire

# Configuration CORS (Production)
quarkus.http.cors=true
quarkus.http.cors.origins=https://your-frontend-instance.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# Configuration OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=NovaPartage API

# Configuration PostgreSQL (Production)
# Les variables d'environnement DB_* doivent être définies dans le .env
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:novapartage}
quarkus.datasource.password=${DB_PASSWORD:novapartage_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:novapartage}

# Hibernate - Génération automatique du schéma
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Configuration pour la production
# L'authentification est gérée par le service auth-service
# Pas de configuration OIDC nécessaire