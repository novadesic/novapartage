# Configuration Quarkus
quarkus.http.port=8083
quarkus.http.host=0.0.0.0

# Configuration d'authentification personnalisée (remplace OIDC)
# OIDC complètement supprimé du pom.xml

# Configuration pour l'authentification personnalisée
# Obligatoire en prod : APP_AUTH_JWT_SECRET (voir env.example)
# En dev : même valeur par défaut que JWT_SECRET du auth-service (docker-compose / env.example)
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:your-super-secret-jwt-key-change-in-production}
app.auth.jwt.issuer=novapartage-auth-service
app.auth.jwt.audience=novapartage-app

# Configuration CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# Configuration OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=NovaPartage API
quarkus.smallrye-openapi.info-version=1.0.0

# Configuration logging
quarkus.log.level=INFO

# Logs d'audit pour les accès fichier (sécurité)
quarkus.log.category."com.novadesic.novapartage.backend.service.ShareService".level=INFO
quarkus.log.category."com.novadesic.novapartage.backend.service.ShareTabdataService".level=DEBUG

# Configuration pour les fichiers multipart
quarkus.http.limits.max-body-size=50M

# Configuration pour le démarrage
quarkus.banner.enabled=true

# Configuration PostgreSQL (remplace MongoDB)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:novapartage}
quarkus.datasource.password=${DB_PASSWORD:novapartage_password}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/novapartage
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:novapartage}

# Flyway - migrations versionnées exécutées au démarrage
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# Baseline pour initialiser Flyway sur une base existante (dev et prod)
# Après le premier démarrage réussi, vous pouvez retirer baseline-on-migrate.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# Hibernate - Génération automatique du schéma (sans scripts)
# IMPORTANT: Utiliser 'update' au lieu de 'drop-and-create' pour préserver les données
# 'drop-and-create' supprime toutes les tables à chaque redémarrage !
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.hibernate-orm.log.sql=false
# Réduire les logs Hibernate (hors SQL)
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.hibernate.orm".level=WARN

# Format JSON pour PostgreSQL (dialect détecté automatiquement)

# Configuration du nouveau système de sécurité des partages
share.tabdata.from-database=true
share.tabdata.compression.enabled=true
share.tabdata.max-size=10485760

# Configuration du stockage de fichiers
# Stockage fichiers (prod / chemin par défaut)
app.file-storage.base-path=../user_files
# En dev : répertoire local au backend (évite user_files/ root créé par Docker en root)
%dev.app.file-storage.base-path=${APP_FILE_STORAGE_BASE_PATH:./user_files}
%prod.app.file-storage.base-path=${APP_FILE_STORAGE_BASE_PATH:/app/files}
app.file-storage.max-file-size=${MAX_FILE_SIZE:50MB}
app.file-storage.allowed-extensions=.xlsx,.xls

# Configuration du chiffrement applicatif des fichiers
# Clé maître pour chiffrer les clés utilisateur (générer avec: openssl rand -base64 32)
# Obligatoire en prod : APP_ENCRYPTION_MASTER_KEY (Base64, 32 bytes — voir env.example)
# En dev : laisser vide autorise une clé temporaire ; sinon définir une clé valide dans .env
app.encryption.master.key=${APP_ENCRYPTION_MASTER_KEY:}

# Configuration Email Service (utilise le microservice email-service)
# L'envoi d'emails se fait maintenant via le service email-service au lieu de SMTP direct
# En développement (backend sur l'hôte) : utiliser localhost:3002
# En production (backend dans Docker) : utiliser email-service:3002
%dev.email-service/mp-rest/url=${EMAIL_SERVICE_URL:http://localhost:3002}
%prod.email-service/mp-rest/url=${EMAIL_SERVICE_URL:http://email-service:3002}
email-service/mp-rest/scope=jakarta.inject.Singleton

