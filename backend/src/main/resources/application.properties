# Configuration des notifications d'expiration d'accès
# Activer/désactiver les notifications d'expiration (par défaut: true)
access.expiration.notification.enabled=${ACCESS_EXPIRATION_NOTIFICATION_ENABLED:true}

# Planification des notifications (format cron Quarkus: 6 parties avec secondes)
# Format: secondes minute heure jour mois jour-semaine
# Exemples:
#   "0 0 */6 * * ?"  - Toutes les 6 heures
#   "0 0 */1 * * ?"  - Toutes les heures
#   "0 0 8 * * ?"    - Tous les jours à 8h
#   "0 0 0 * * ?"    - Tous les jours à minuit
access.expiration.notification.schedule=${ACCESS_EXPIRATION_NOTIFICATION_SCHEDULE:0 0 */6 * * ?}

# Durées avant expiration pour lesquelles envoyer des notifications (en heures)
# Format: "72h,24h" ou "3d,1d" ou "72,24" (séparées par des virgules)
# Par défaut: 72 heures (3 jours) et 24 heures avant expiration
access.expiration.notification.deltas=${ACCESS_EXPIRATION_NOTIFICATION_DELTAS:72h,24h}

# ============================================================================
# POLITIQUE DE CONSERVATION DES DONNÉES (RGPD)
# ============================================================================
# Durées de conservation des données personnelles conformément au RGPD

# Partages
data.retention.shares.deleted.days=${DATA_RETENTION_SHARES_DELETED_DAYS:30}
data.retention.shares.new.days=${DATA_RETENTION_SHARES_NEW_DAYS:7}
data.retention.shares.finished.months=${DATA_RETENTION_SHARES_FINISHED_MONTHS:18}
data.retention.shares.inactive.months=${DATA_RETENTION_SHARES_INACTIVE_MONTHS:7}
data.retention.shares.inactive.warning.months=${DATA_RETENTION_SHARES_INACTIVE_WARNING_MONTHS:6}

# Fichiers temporaires
data.retention.temp.files.hours=${DATA_RETENTION_TEMP_FILES_HOURS:24}

# Tokens d'accès
data.retention.tokens.expired.days=${DATA_RETENTION_TOKENS_EXPIRED_DAYS:90}
data.retention.tokens.validated.years=${DATA_RETENTION_TOKENS_VALIDATED_YEARS:1}

# Soumissions de formulaires
data.retention.form.submissions.orphan.years=${DATA_RETENTION_FORM_SUBMISSIONS_ORPHAN_YEARS:1}

# Logs
data.retention.logs.audit.months=${DATA_RETENTION_LOGS_AUDIT_MONTHS:12}
data.retention.logs.application.months=${DATA_RETENTION_LOGS_APPLICATION_MONTHS:3}

# Invitations démo (lien à usage unique, période testeur)
app.demo.invite-validity-days=${DEMO_INVITE_VALIDITY_DAYS:60}
app.demo.entitlement-days=${DEMO_ENTITLEMENT_DAYS:30}
