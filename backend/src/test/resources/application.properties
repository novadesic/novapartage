# ============================================================================
# CONFIGURATION DES TESTS - PostgreSQL REQUIS
# ============================================================================
# 
# IMPORTANT: Les tests nécessitent PostgreSQL car H2 ne supporte pas JSONB
# qui est utilisé dans les entités (Share, Recipient, FormSubmission, etc.)
#
# Pour exécuter les tests :
# 1. Installer PostgreSQL (si pas déjà installé)
#    - Ubuntu/Debian: sudo apt-get install postgresql postgresql-contrib
#    - macOS: brew install postgresql
#    - Windows: Télécharger depuis https://www.postgresql.org/download/
#
# 2. Démarrer PostgreSQL
#    - Ubuntu/Debian: sudo systemctl start postgresql
#    - macOS: brew services start postgresql
#
# 3. Créer une base de données de test
#    psql -U postgres
#    CREATE DATABASE novapartage_test;
#    \q
#
# 4. Configurer les paramètres ci-dessous (déjà configurés par défaut)
#
# ============================================================================

# DÉSACTIVER Dev Services pour éviter les tentatives de démarrage Docker
quarkus.devservices.enabled=false

# Configuration PostgreSQL (REQUIS pour les tests)
# Utilise les identifiants du conteneur Docker novapartage-postgres
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/novapartage_test
quarkus.datasource.username=${DB_USERNAME:novapartage}
quarkus.datasource.password=${DB_PASSWORD:novapartage_password}

# Hibernate - Génération automatique du schéma pour les tests
# Utilise 'drop-and-create' pour recréer le schéma à chaque exécution des tests
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Désactiver les logs verbeux pendant les tests
quarkus.log.level=WARN
quarkus.log.category."com.novadesic.novapartage.backend".level=INFO

# Configuration pour les tests
quarkus.scheduler.enabled=false

# Configuration du service email pour les tests
# Utilise MockTemplateEmailServiceHelper (@Alternative) pour éviter les connexions réelles
# Activer les alternatives CDI pour que le mock soit utilisé
quarkus.arc.selected-alternatives=com.novadesic.novapartage.backend.service.MockTemplateEmailServiceHelper

