<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td {font-family: Arial, sans-serif !important;}
    </style>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; line-height: 1.6;">
    <!-- Wrapper principal -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f8f9fa; padding: 20px;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <!-- Container principal (max-width: 600px) -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden;">
                    
                    <!-- Header avec logo, titre et slogan -->
                    <tr>
                        <td style="padding: 50px 30px 40px 30px; text-align: center; background-color: #ffffff;">
                            <!-- Logo container -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td align="center" style="padding-bottom: 25px;">
                                        <img src="cid:logo@novapartage" alt="NovaPartage Logo" style="height: 128px; width:128px; display: block; margin: 0 auto;" />
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-bottom: 15px;">
                                        <!-- Titre NovaPartage avec lien -->
                                        <h1 style="margin: 0; font-size: 40px; font-weight: bold; color: #212529; text-align: center; line-height: 1.2;">
                                            <a href="https://novapartage.fr" style="color: #212529; text-decoration: none;">NovaPartage</a>
                                        </h1>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-bottom: 10px;">
                                        <!-- Slogan -->
                                        <p style="margin: 0; font-size: 20px; font-weight: 300; color: #2071aa; text-align: center; line-height: 1.4;">
                                            Partagez des données, pas vos fichiers.
                                        </p>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top: 20px; padding-bottom: 10px;">
                                        <!-- Sous-titre du message -->
                                        <p style="margin: 0; font-size: 16px; font-weight: 400; color: #6c757d; text-align: center; line-height: 1.5;">
                                            {{headerSubtitle}}
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                    <!-- Contenu principal -->
                    <tr>
                        <td style="padding: 40px 30px; background-color: #ffffff;">
                            <!-- Body content -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td style="color: #212529; font-size: 16px; line-height: 1.6;">
                                        {{bodyContent}}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px; background-color: #f8f9fa; text-align: center; border-top: 1px solid #e9ecef;">
                            <p style="margin: 0 0 10px 0; color: #6c757d; font-size: 14px; line-height: 1.5;">
                                Cet email a été envoyé automatiquement par <strong style="color: #2071aa;"><a href="https://novapartage.fr" style="color: #2071aa; text-decoration: none;">NovaPartage</a></strong>
                            </p>
                            <p style="margin: 0; color: #999; font-size: 12px;">
                                Si vous n'avez pas demandé cet email, vous pouvez l'ignorer.
                            </p>
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
