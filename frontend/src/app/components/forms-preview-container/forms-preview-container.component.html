<div class="forms-preview-container">
  <div class="preview-header">
    <h4 class="mb-3">
      <i class="bi bi-eye me-2"></i>
      Prévisualisation des formulaires
    </h4>
    
    <!-- Navigation entre destinataires -->
    <div class="recipient-navigation mb-3">
      <div class="d-flex align-items-center justify-content-between">
        <button type="button" class="btn btn-outline-secondary" 
                [disabled]="!canGoPrevious()" 
                (click)="previousRecipient()">
          <i class="bi bi-chevron-left"></i>
          Précédent
        </button>
        
        <div class="recipient-info">
          <span class="badge bg-primary me-2">{{ activeRecipientIndex + 1 }} / {{ recipients.length }}</span>
          <strong>{{ activeRecipient?.email }}</strong>
        </div>
        
        <button type="button" class="btn btn-outline-secondary" 
                [disabled]="!canGoNext()" 
                (click)="nextRecipient()">
          Suivant
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- Sélecteur rapide de destinataire -->
    <div class="recipient-tabs mb-3">
      <div class="nav nav-pills">
        <button *ngFor="let recipient of recipients; let i = index"
                class="nav-link"
                [class.active]="i === activeRecipientIndex"
                (click)="setActiveRecipient(i)">
          {{ recipient.email }}
        </button>
      </div>
    </div>
  </div>

  <div class="recipients-navigation mb-4">
    <h5>Destinataires</h5>
    <div class="btn-group" role="group">
      <button 
        *ngFor="let recipient of recipients; let i = index" 
        type="button" 
        class="btn btn-outline-primary"
        [class.active]="i === activeRecipientIndex"
        (click)="setActiveRecipient(i)">
        {{ getRecipientDisplayName(recipient, i) }}
      </button>
    </div>
  </div>

  <!-- Prévisualisation du formulaire actif -->
  <div class="preview-content" *ngIf="recipients.length > 0">
    <app-form-preview
      [data]="filteredTableData"
      [selection]="activeSelection"
      [sheets]="sheets"
      [selectedSheetIndex]="selectedSheetIndex"
      [columnLabels]="activeColumnLabelsForFormPreview"
      [headers]="headers"
      [pageTitle]="activePageTitle"
      [pageDescription]="activePageDescription"
      [recipientEmail]="activeRecipient.email"
      [editableCells]="activeEditableCellsForFormPreview"
      [allowTitleEdit]="true"
      [isPreviewMode]="true"
      [totalRecipients]="recipients.length"
      (pageTitleChange)="onPageTitleChange($event)"
      (pageDescriptionChange)="onPageDescriptionChange($event)">
    </app-form-preview>
  </div>

  <!-- Message si aucun destinataire -->
  <div class="no-recipients" *ngIf="recipients.length === 0">
    <div class="text-center py-5">
      <i class="bi bi-people text-muted" style="font-size: 3rem;"></i>
      <h5 class="mt-3">Aucun destinataire</h5>
      <p class="text-muted">Ajoutez des destinataires dans les étapes précédentes pour voir les prévisualisations.</p>
    </div>
  </div>
</div>
