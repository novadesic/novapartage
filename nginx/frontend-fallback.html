<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPartage - Service temporairement indisponible</title>
    <base href="/">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-image: url('/background.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.98);
            background-position: 20px bottom;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            position: relative;
        }
        
        /* Overlay semi-transparent pour assurer la lisibilité du contenu */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.92);
            z-index: -1;
            pointer-events: none;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: none;
            max-width: 600px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 1;
        }
        
        .card-body {
            padding: 3rem;
            text-align: center;
        }
        
        .logo-container {
            margin-bottom: 2rem;
        }
        
        .logo-container img {
            height: 8rem;
            width: auto;
            max-width: 100%;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 1rem;
        }
        
        .lead {
            font-size: 1.25rem;
            font-weight: 300;
            color: #6c757d;
            margin-bottom: 2rem;
        }
        
        .message-container {
            background: linear-gradient(135deg, #2071aa 0%, #1a5d8a 100%);
            color: white;
            padding: 2rem;
            border-radius: 10px;
            margin: 2rem 0;
        }
        
        .message-container i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
        
        .message-container h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .message-container p {
            font-size: 1.1rem;
            margin: 0;
            opacity: 0.95;
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #2071aa 0%, #1a5d8a 100%);
            border: none;
            border-radius: 25px;
            padding: 0.75rem 2rem;
            font-weight: 500;
            color: white;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
        }
        
        .btn-refresh:hover {
            background: linear-gradient(135deg, #1a5d8a 0%, #155080 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(32, 113, 170, 0.4);
            color: white;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .lead {
                font-size: 1.1rem;
            }
            
            .card-body {
                padding: 2rem 1.5rem;
            }
            
            .message-container {
                padding: 1.5rem;
            }
            
            .message-container h2 {
                font-size: 1.25rem;
            }
            
            .message-container p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <div class="card shadow-lg border-0 bg-light">
                    <div class="card-body">
                        <!-- Logo -->
                        <div class="logo-container">
                            <img src="/logo.png" alt="NovaPartage Logo" onerror="this.style.display='none';">
                        </div>
                        
                        <!-- Titre et description -->
                        <h1 class="display-4 fw-bold text-dark mb-2">
                            NovaPartage
                        </h1>
                        <p class="lead text-primary mb-4">
                            Partagez des données, pas vos fichiers.
                        </p>
                        
                        <!-- Message d'indisponibilité -->
                        <div class="message-container">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <h2>Service temporairement indisponible</h2>
                            <p>NovaPartage est victime de son succès, veuillez recharger la page ultérieurement.</p>
                        </div>
                        
                        <!-- Bouton de rechargement -->
                        <button class="btn btn-refresh" onclick="window.location.reload()">
                            <i class="bi bi-arrow-clockwise me-2"></i>
                            Recharger la page
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS (optionnel, pour les animations) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
