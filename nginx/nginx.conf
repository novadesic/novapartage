events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolver DNS pour résolution dynamique des noms d'hôtes Docker
    # Permet à nginx de démarrer même si les services ne sont pas encore prêts
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        
        # Augmenter la taille des en-têtes pour éviter les erreurs 502
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 100m;

        # Headers CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

        # Page de statut
        location = /status {
            return 200 "NovaPartage - Services Status\n\nFrontend: http://localhost\nAuth Service: http://localhost/auth\nMailpit Web UI: http://localhost:8025\nBackend: http://localhost/backend\nPostgreSQL: localhost:5432\n\nTo start services:\n- Backend: cd backend && ./start.sh (port 8083)\n- Frontend: cd frontend && ./start.sh (port 4200)\n\nEmail testing:\n- Mailpit SMTP: localhost:1025\n- Mailpit Web UI: http://localhost:8025\n";
            add_header Content-Type text/plain;
        }

        # Service d'authentification API routes (accessible via /auth)
        # Utilisation d'une variable pour résolution DNS dynamique
        location /auth/ {
            set $auth_service "auth-service:3001";
            # Supprimer le préfixe /auth/ avant de faire le proxy
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_intercept_errors on;
            error_page 502 503 504 = @auth_down;
        }

        # Page d'erreur pour auth-service non disponible
        location @auth_down {
            return 502 "Auth service is not running.\n\nPlease wait for the auth-service to start.\n";
            add_header Content-Type text/plain;
        }




        # Backend API routes
        location /backend/ {
            proxy_pass http://host.docker.internal:8083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            rewrite ^/backend/(.*)$ /$1 break;
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_down;
        }

        # Page d'erreur pour backend non disponible
        location @backend_down {
            return 502 "Backend service is not running.\n\nPlease start the backend:\ncd backend && mvn quarkus:dev\n";
            add_header Content-Type text/plain;
        }

        # Servir le logo et l'image de fond pour la page de fallback
        location = /logo.png {
            root /etc/nginx;
        }
        
        location = /background.jpg {
            root /etc/nginx;
        }

        # Frontend routes (tout le reste - accessible directement sur port 4200)
        location / {
            proxy_pass http://host.docker.internal:4200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_intercept_errors on;
            error_page 502 503 504 = @frontend_down;
        }

        # Page d'erreur pour frontend non disponible
        location @frontend_down {
            internal;
            root /etc/nginx;
            rewrite ^ /frontend-fallback.html break;
        }
    }
} 
