events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 100m;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

        location = /status {
            return 200 "NovaPartage - Self-host stack\n\nApplication: http://localhost\nAuth API: http://localhost/auth\nBackend API: http://localhost/backend\nMailpit UI: http://localhost:8025\n\nStart: docker compose -f docker-compose.selfhost.yml up --build -d\nSuperadmin: ./scripts/init-superadmin.sh admin@example.com\n";
            add_header Content-Type text/plain;
        }

        location /auth/ {
            set $auth_service "auth-service:3001";
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_intercept_errors on;
            error_page 502 503 504 = @auth_down;
        }

        location @auth_down {
            return 502 "Auth service is not running.\n\nCheck: docker compose -f docker-compose.selfhost.yml ps auth-service\n";
            add_header Content-Type text/plain;
        }

        location /backend/ {
            set $backend_service "backend:8083";
            rewrite ^/backend/(.*)$ /$1 break;
            proxy_pass http://$backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_down;
        }

        location @backend_down {
            return 502 "Backend service is not running.\n\nCheck: docker compose -f docker-compose.selfhost.yml ps backend\n";
            add_header Content-Type text/plain;
        }

        location = /logo.png {
            root /etc/nginx;
        }

        location = /background.jpg {
            root /etc/nginx;
        }

        location / {
            set $frontend_service "frontend:80";
            proxy_pass http://$frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_intercept_errors on;
            error_page 502 503 504 = @frontend_down;
        }

        location @frontend_down {
            internal;
            root /etc/nginx;
            rewrite ^ /frontend-fallback.html break;
        }
    }
}
